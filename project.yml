name: Luo
options:
  bundleIdPrefix: com.charliezong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Throwaway tuning harness — keep Swift 5 language mode so the @MainActor /
    # CoreMotion closure hops don't trip Swift 6 strict-concurrency errors.
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    # GENERATE_INFOPLIST_FILE omits CFBundleShortVersionString / CFBundleVersion
    # unless these are set — App Store Connect rejects uploads without them.
    # Bump CURRENT_PROJECT_VERSION for every upload; it must be unique per build.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_NSMotionUsageDescription: "落 reads device motion so your shake casts the coin."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # Export compliance, declared by Charlie 2026-08-08 in App Store Connect
    # ("None of the algorithms mentioned above"): the only crypto here is
    # CryptoKit AES-GCM for the 白话 corpus, i.e. encryption provided by Apple's
    # OS — nothing proprietary and no bundled implementation of our own. Setting
    # this stops TestFlight asking on every upload. Revisit if that ever changes.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  Luo:
    type: application
    platform: iOS
    sources:
      - path: Luo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charliezong.luo
        # MUST live on the target: a project-level TARGETED_DEVICE_FAMILY is
        # overridden by the target's own default (1,2), so "iPhone only" silently
        # did nothing and the bundle shipped universal. App Store upload then
        # rejects with 90474 (iPad multitasking wants all four orientations).
        TARGETED_DEVICE_FAMILY: "1"            # iPhone only
        # Apple Developer Program (paid, enrolled 2026-08-08) — signs device
        # builds and App Store / TestFlight distribution. Simulator builds ignore
        # it. Same team ID as the old free Personal Team: enrolling upgrades the
        # team in place. Provisioning profiles now last a year, not 7 days.
        DEVELOPMENT_TEAM: "Q8XV65MMXK"
        CODE_SIGN_STYLE: Automatic

  LuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LuoTests
    dependencies:
      - target: Luo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charliezong.luoTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Luo:
    build:
      targets:
        Luo: all
    test:
      targets:
        - LuoTests
